services:
  postgres:
    image: ${RATEFREAK_POSTGRES_IMAGE:-postgres:17-trixie@sha256:87c8b42f423b45d5247e6aa8fdb2e7762fec164c68a50fe3eb07e7bfcaf4dbcf}
    restart: unless-stopped
    command: [postgres, -c, jit=off]
    environment:
      # Exclude aligned secondary malloc arenas (CVE-2019-1010025).
      GLIBC_TUNABLES: glibc.malloc.arena_max=1
      POSTGRES_DB: ratefreak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/ratefreak/postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ${RATEFREAK_INSTANCE_DIR:?Initialize an instance}/runtime/postgres:/run/ratefreak:ro
      - ./database.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ratefreak']
      interval: 3s
      timeout: 3s
      retries: 30

  api:
    image: ${RATEFREAK_API_IMAGE:-ratefreak-api:local}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs: ['/tmp:uid=10001,gid=10001,mode=1777']
    environment: &api-environment
      GLIBC_TUNABLES: glibc.malloc.arena_max=1
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      Updates__Enabled: ${RATEFREAK_UPDATES_ENABLED:-false}
      DOTNET_BUNDLE_EXTRACT_BASE_DIR: /tmp/ratefreak-bundle
      AllowedHosts: api
      BrowserProxy__AllowPrivateHttp: 'true'
      BrowserProxy__PublicOrigin: ${RATEFREAK_PUBLIC_ORIGIN}
      Authentication__DataProtectionKeysPath: /data/keys
      Authentication__External__PublicOrigin: ${RATEFREAK_PUBLIC_ORIGIN:?Set a public origin}
      Artwork__Enabled: 'true'
      Artwork__RootPath: /data/artwork
      AccountData__ErasureJournalPath: ${RATEFREAK_API_ERASURE_JOURNAL_PATH:-}
      Providers__Tmdb__PolicyPath: /independent/tmdb-policy.json
      Providers__Igdb__PolicyPath: /independent-igdb/igdb-policy.json
    volumes: &api-volumes
      - ${RATEFREAK_INSTANCE_DIR}/runtime/api:/run/ratefreak:ro
      - ${RATEFREAK_INSTANCE_DIR}/storage/artwork:/data/artwork
      - ${RATEFREAK_INSTANCE_DIR}/storage/keys:/data/keys
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/tmdb
        target: /independent
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/igdb
        target: /independent-igdb
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/account-erasures.jsonl
        target: /journal/account-erasures.jsonl
        bind: {create_host_path: false}
    depends_on:
      postgres: {condition: service_healthy}
    networks: [application, database]
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://api:8080/health/ready]
      interval: 5s
      timeout: 5s
      retries: 30

  web:
    image: ${RATEFREAK_WEB_IMAGE:-ratefreak-web:local}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1777
      - /app/.next/cache:uid=10001,gid=10001,mode=0700
    environment:
      GLIBC_TUNABLES: glibc.malloc.arena_max=1
      NODE_ENV: production
      RATEFREAK_API_URL: http://api:8080
      RATEFREAK_WEB_ORIGIN: ${RATEFREAK_PUBLIC_ORIGIN}
      RATEFREAK_CLIENT_IP_MODE: trusted-proxy
      RATEFREAK_ALLOW_PRIVATE_API_HTTP: 'true'
      RATEFREAK_TMDB_POLICY_PATH: /independent/tmdb-policy.json
      RATEFREAK_TMDB_CACHE_PATH: /data/tmdb-posters
      RATEFREAK_IGDB_POLICY_PATH: /independent-igdb/igdb-policy.json
      RATEFREAK_IGDB_CACHE_PATH: /data/igdb-covers
    volumes:
      - ${RATEFREAK_INSTANCE_DIR}/runtime/web:/run/ratefreak:ro
      - ${RATEFREAK_INSTANCE_DIR}/storage/image-cache:/app/.next/cache/images
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/tmdb
        target: /independent
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/igdb
        target: /independent-igdb
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/storage/tmdb-posters
        target: /data/tmdb-posters
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/storage/igdb-covers
        target: /data/igdb-covers
        bind: {create_host_path: false}
    depends_on:
      api: {condition: service_healthy}
    networks: [ingress, application]
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',3000),3).close()"]
      interval: 5s
      timeout: 5s
      retries: 30

  storage-init:
    image: ${RATEFREAK_TOOLS_IMAGE:-ratefreak-tools:local}
    user: '0:0'
    command: [prepare]
    profiles: [maintenance]
    environment:
      GLIBC_TUNABLES: glibc.malloc.arena_max=1
    volumes:
      - ${RATEFREAK_INSTANCE_DIR}:/instance
    network_mode: none

  migrate:
    image: ${RATEFREAK_TOOLS_IMAGE:-ratefreak-tools:local}
    command: [migrate]
    profiles: [maintenance]
    environment: *api-environment
    volumes:
      - ${RATEFREAK_INSTANCE_DIR}/runtime/tools:/run/ratefreak:ro
      - ${RATEFREAK_INSTANCE_DIR}/storage/keys:/data/keys
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}

  tools:
    image: ${RATEFREAK_TOOLS_IMAGE:-ratefreak-tools:local}
    profiles: [maintenance]
    environment:
      <<: *api-environment
      AccountData__ErasureJournalPath: /journal/account-erasures.jsonl
    volumes:
      - ${RATEFREAK_INSTANCE_DIR}/runtime/tools:/run/ratefreak:ro
      - ${RATEFREAK_INSTANCE_DIR}/storage/artwork:/data/artwork
      - ${RATEFREAK_INSTANCE_DIR}/storage/keys:/data/keys
      - ${RATEFREAK_INSTANCE_DIR}/independent:/journal
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/tmdb
        target: /independent
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/independent/igdb
        target: /independent-igdb
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/storage/tmdb-posters
        target: /data/tmdb-posters
        bind: {create_host_path: false}
      - type: bind
        source: ${RATEFREAK_INSTANCE_DIR}/storage/igdb-covers
        target: /data/igdb-covers
        bind: {create_host_path: false}
    networks: [database]
    depends_on:
      postgres: {condition: service_healthy}

networks:
  ingress:
  application:
  database:
    internal: true
volumes:
  postgres_data:
