name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.28.2
      - name: Verify source
        run: python3 deploy/release/verify.py --report-directory "$RUNNER_TEMP/verification-raw" --public-report-directory "$RUNNER_TEMP/verification"
      - name: Retain verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verification
          retention-days: 14
          if-no-files-found: error
