name: Prepare release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
      source_materials_artifact_id:
        description: Exact same-repository artifact ID containing reviewed release-source-materials artifact; missing coverage blocks completion
        required: false
        type: string
      candidate_artifact_id:
        description: Exact same-repository artifact ID containing the incomplete candidate to finalize without rebuilding
        required: false
        type: string
      baseline_artifact_id:
        description: Exact completed candidate artifact matching the preceding published stable release (required after 0.1.0)
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve one immutable source revision
        id: resolve
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
        run: python3 deploy/release/workflow_checks.py resolve
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.revision }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@10.28.2
      - name: Validate exact candidate artifact provenance
        if: inputs.candidate_artifact_id != ''
        id: candidate_source
        env:
          REVIEW_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          REVIEW_ARTIFACT_KIND: candidate
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/release/workflow_checks.py validate-artifact
      - name: Obtain exact candidate under review
        if: inputs.candidate_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
          artifact-ids: ${{ steps.candidate_source.outputs.artifact_id }}
          run-id: ${{ steps.candidate_source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Validate exact source-material artifact provenance
        if: inputs.source_materials_artifact_id != ''
        id: source_materials
        env:
          REVIEW_ARTIFACT_ID: ${{ inputs.source_materials_artifact_id }}
          REVIEW_ARTIFACT_KIND: sources
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/release/workflow_checks.py validate-artifact
      - name: Obtain reviewed image-bound source materials
        if: inputs.source_materials_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          merge-multiple: true
          artifact-ids: ${{ steps.source_materials.outputs.artifact_id }}
          run-id: ${{ steps.source_materials.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/release-source-materials
      - name: Validate exact preceding-release artifact provenance
        if: inputs.baseline_artifact_id != ''
        id: baseline_source
        env:
          REVIEW_ARTIFACT_ID: ${{ inputs.baseline_artifact_id }}
          REVIEW_ARTIFACT_KIND: candidate
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 deploy/release/workflow_checks.py validate-artifact
      - name: Obtain preceding published release bundle
        if: inputs.baseline_artifact_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          artifact-ids: ${{ steps.baseline_source.outputs.artifact_id }}
          merge-multiple: true
          run-id: ${{ steps.baseline_source.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/previous-release
      - name: Prepare exact candidate without publication
        if: inputs.candidate_artifact_id == ''
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
          RATEFREAK_BASELINE_BUNDLE: ${{ inputs.baseline_artifact_id != '' && format('{0}/previous-release/release', runner.temp) || '' }}
        run: python3 deploy/release/prepare.py --tag "$CANDIDATE_TAG" --output "$RUNNER_TEMP/candidate" --compliance "$RUNNER_TEMP/release-source-materials"
      - name: Finalize reviewed candidate without rebuilding
        if: inputs.candidate_artifact_id != ''
        env:
          CANDIDATE_TAG: ${{ inputs.tag }}
          RATEFREAK_BASELINE_BUNDLE: ${{ inputs.baseline_artifact_id != '' && format('{0}/previous-release/release', runner.temp) || '' }}
        run: python3 deploy/release/prepare.py --resume --tag "$CANDIDATE_TAG" --output "$RUNNER_TEMP/candidate" --compliance "$RUNNER_TEMP/release-source-materials"
      - name: Retain candidate or incomplete diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-review-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
          retention-days: 14
          if-no-files-found: warn
